name: MUI foundation verification

on:
  push:
    branches:
      - feat/ui-mui-foundation-v1-impl
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Install, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Build
        run: bun run build
