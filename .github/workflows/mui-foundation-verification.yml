name: Temporary MUI foundation verification

on:
  push:
    branches:
      - feat/ui-mui-foundation-v1-impl

permissions:
  contents: write

concurrency:
  group: mui-foundation-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ui-mui-foundation-v1-impl
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies and refresh lockfile
        run: bun install
      - name: Type-check
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Commit lockfile if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore(deps): update Bun lockfile for MUI foundation"
            git push origin HEAD:feat/ui-mui-foundation-v1-impl
          fi
